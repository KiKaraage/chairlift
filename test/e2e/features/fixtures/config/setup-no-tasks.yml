# Every group the setup assistant can offer a choice for, disabled by an
# administrator. With CHAIRLIFT_CAPABILITIES reduced to image-descriptor the
# Flatpak, Homebrew and bootc-stage groups are floored out as well, so the
# assistant's model has no optional task and Configure Everything completes
# setup from the welcome screen.
#
# Loaded from an untrusted path (config.dev.yml beside a staged binary), so no
# action may set sudo: true.
livery_page:
  livery_app_grid_group:
    enabled: false
  livery_foundation_group:
    enabled: false
  livery_dock_group:
    enabled: false
features_page:
  features_group:
    enabled: false
